name: test

# PR 和 push 到 master：格式检查 + clippy + 测试（Linux/macOS/Windows）+ MSRV 编译检查。
# 发布流程见 release.yml（只管 release 分支）。
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# 同一 PR / master 上的新推送取消尚未跑完的旧运行，节省 CI 时间
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # 格式与平台无关，只需在一个 runner 上跑
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # AGENTS.md 约定：单元测试拆到 src/<module>/tests.rs，生产源码不内嵌
      # #[cfg(test)] 门控的模块体。检查脚本 token-aware，不依赖代码格式：
      # gate 与 mod 之间夹注释、空行、其他 attribute 一样会被拦下。
      - name: No embedded test modules
        if: runner.os == 'Linux'
        run: |
          python3 scripts/check_no_inline_tests.py --self-test
          python3 scripts/check_no_inline_tests.py src

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # 已知的可接受技术债：kothok-edge-tts 经由其 tokio-rustls 依赖的默认
      # 特性把 aws-lc-sys（源码构建需要 cmake）拉进依赖树，运行时 TLS 实际
      # 用 ring。本步骤不拦截构建：aws-lc-rs 在树里时发 warning 注解；
      # 哪天它消失（上游修正），提醒移除本检查和 README 的 cmake 说明。
      # 文档物化层（lopdf/calamine/zip）必须保持纯 Rust deflate 后端
      # （miniz_oxide / zlib-rs）：libz-sys / zlib-ng-sys 一旦进树即失败，
      # 守住"单个可执行文件、无 runtime 依赖"的性质。
      - name: Dependency tree report (aws-lc-rs, C backends)
        if: runner.os == 'Linux'
        run: |
          if cargo tree --locked -i aws-lc-rs; then
            echo "::warning::aws-lc-rs is in the dependency tree (via kothok-edge-tts → tokio-rustls default features). Runtime TLS uses ring; source builds need cmake. Accepted tech debt — see README."
          else
            echo "::notice::aws-lc-rs has left the dependency tree (upstream fixed?). Update the README build note and remove this check."
          fi
          for crate in libz-sys zlib-ng-sys; do
            if cargo tree --locked -i "$crate" >/dev/null 2>&1; then
              echo "::error::$crate appeared in the dependency tree; the document loaders (lopdf/calamine/zip) must stay on pure-Rust deflate (miniz_oxide/zlib-rs)"
              exit 1
            fi
          done
          echo "no C zlib backends in the tree"

  no-default-features:
    # R06：edge-tts 现在是 aido 侧 feature（默认开启）。关掉它必须仍然可编译，
    # 且 kothok-edge-tts 子树（连同 aws-lc-sys）整体离开依赖树。只跑 check +
    # clippy --all-targets（编译测试，但不在无 TTS 的二进制上运行集成测试——
    # 默认特性的 check job 已覆盖运行时行为）。
    name: no-default-features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: no-default-features

      - name: Check (no default features)
        run: cargo check --locked --no-default-features

      - name: Clippy (no default features)
        run: cargo clippy --all-targets --locked --no-default-features -- -D warnings

      - name: Assert aws-lc-rs left the tree
        run: |
          if cargo tree --locked -i aws-lc-rs --no-default-features >/dev/null 2>&1; then
            echo "::error::aws-lc-rs is still in the no-default-features tree"
            exit 1
          else
            echo "aws-lc-rs is out of the tree (edge-tts feature off)"
          fi

  pdfium:
    # `pdfium` feature 的渲染回退（pdf_render.rs 与 pdf.rs 的全部
    # #[cfg(feature = "pdfium")] 分支）默认构建完全编译不到，唯一能
    # 验证它的地方就是这里：链接 kernoeb/pdfium-static 的静态档案跑
    # 全量测试。档案 ~21 MB，按内容寻址缓存。
    name: pdfium
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PDFIUM_TAG: chromium/7985
      # kernoeb/pdfium-static release 资产的 sha256（gh api 取的 digest）
      PDFIUM_SHA256: e135b87152fbf4a78fe02a1e2b3228cdd7e60af9888546cd4399790e7e80dff4
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: pdfium

      - name: Fetch static pdfium archive
        run: |
          mkdir -p "$RUNNER_TEMP/pdfium"
          cd "$RUNNER_TEMP/pdfium"
          curl -sSfL -O "https://github.com/kernoeb/pdfium-static/releases/download/${PDFIUM_TAG}/libpdfium-linux-x64.a"
          echo "${PDFIUM_SHA256}  libpdfium-linux-x64.a" | sha256sum -c -
          # build.rs 以 `-lpdfium` 链接,链接器只认 libpdfium.a 这个名字
          mv libpdfium-linux-x64.a libpdfium.a

      - name: Clippy (pdfium)
        env:
          PDFIUM_LIB_DIR: ${{ runner.temp }}/pdfium
        run: cargo clippy --all-targets --locked --features pdfium -- -D warnings

      - name: Test (pdfium)
        env:
          PDFIUM_LIB_DIR: ${{ runner.temp }}/pdfium
        run: cargo test --locked --features pdfium

  musl:
    # x86_64-unknown-linux-musl 是 release 产物目标（全静态 Linux 二进制）。
    # PR 阶段跑 check（会执行 build script、编译 aws-lc-sys 的 C 代码，真实走
    # musl 工具链），避免 musl 兼容性破坏拖到发版才暴露。
    name: musl check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install musl-tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          key: musl-check

      - name: Check (musl)
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo check --locked --target x86_64-unknown-linux-musl

  msrv:
    # 验证 Cargo.toml 声明的 rust-version 真的能编译（--locked 锁定依赖版本，防止依赖漂移掩盖问题）
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Get MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      # 工具链版本来自上一步输出，只能用 @master + toolchain 输入（@stable 等标签会忽略该输入）
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check MSRV
        run: cargo check --all-targets --locked
