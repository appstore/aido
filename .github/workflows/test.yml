name: test

# PR 和 push 到 master：格式检查 + clippy + 测试，Linux/macOS 双平台。
# 发布流程见 release.yml（只管 release 分支）。
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# 同一 PR / master 上的新推送取消尚未跑完的旧运行，节省 CI 时间
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # 格式与平台无关，只需在一个 runner 上跑
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
