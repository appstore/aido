name: test

# PR 和 push 到 master：格式检查 + clippy + 测试（Linux/macOS）+ MSRV 编译检查。
# 发布流程见 release.yml（只管 release 分支）。
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

# 同一 PR / master 上的新推送取消尚未跑完的旧运行，节省 CI 时间
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.os }}

      # 格式与平台无关，只需在一个 runner 上跑
      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      # 已知的可接受技术债：kothok-edge-tts 经由其 tokio-rustls 依赖的默认
      # 特性把 aws-lc-sys（源码构建需要 cmake）拉进依赖树，运行时 TLS 实际
      # 用 ring。本步骤不拦截构建：aws-lc-rs 在树里时发 warning 注解；
      # 哪天它消失（上游修正），提醒移除本检查和 README 的 cmake 说明。
      - name: Dependency tree report (aws-lc-rs)
        if: runner.os == 'Linux'
        run: |
          if cargo tree --locked -i aws-lc-rs; then
            echo "::warning::aws-lc-rs is in the dependency tree (via kothok-edge-tts → tokio-rustls default features). Runtime TLS uses ring; source builds need cmake. Accepted tech debt — see README."
          else
            echo "::notice::aws-lc-rs has left the dependency tree (upstream fixed?). Update the README build note and remove this check."
          fi

  msrv:
    # 验证 Cargo.toml 声明的 rust-version 真的能编译（--locked 锁定依赖版本，防止依赖漂移掩盖问题）
    name: msrv
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Get MSRV from Cargo.toml
        id: msrv
        run: echo "version=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml | head -n1)" >> "$GITHUB_OUTPUT"

      # 工具链版本来自上一步输出，只能用 @master + toolchain 输入（@stable 等标签会忽略该输入）
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv

      - name: Check MSRV
        run: cargo check --all-targets --locked
