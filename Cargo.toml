[package]
name = "aido"
version = "0.4.0"
edition = "2021"
# 依赖下限：image 0.25 与 reqwest 传递引入的 icu_* 系列声明 1.88；CI 的 msrv job 验证
rust-version = "1.88"
description = "Send material to an AI task (OCR, translate, TTS, images, ...) and deliver the result to stdout, files or the clipboard"

[features]
default = ["edge-tts"]
# Keyless Microsoft Read-Aloud TTS. Optional: closing it drops the whole
# kothok-edge-tts subtree (and aws-lc-sys, which needs cmake) from the
# build graph. Build with --no-default-features for an aido without TTS.
edge-tts = ["dep:kothok-edge-tts", "dep:futures-util"]
# Static pdfium rendering for PDFs aido cannot extract anything from
# (vector-drawn pages). Off by default: the build needs PDFIUM_LIB_DIR
# pointing at a static pdfium archive (see build.rs), and the binary
# grows by the archive's size. Default builds render nothing and never
# touch pdfium.
pdfium = []

[dependencies]
# Office/OpenDocument/RTF/CSV → markdown 转换后端（materialize/document.rs）。
# 纯 Rust、自带 ResourceLimit 防护（解压/嵌套深度/节点数），因此不需要
# feature 门控；容器格式的炸弹防护仍由 materialize/security.rs 把守。
anydoc = "0.2"
anyhow = "1"
arboard = { version = "3", features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
# 自己展开 glob（引号包裹 / Windows 下 shell 不会展开）；零传递依赖。
glob = "0.3"
# Edge TTS 适配器（"edge-tts" feature，默认开启）：非官方 Read Aloud 协议
# （DRM 常量会轮换，跟随 0.2.x 补丁更新）。feature 开启时的已知代价：kothok
# 经由其 tokio-rustls 依赖的默认特性把 aws-lc-sys（源码构建需要 cmake）拉进
# 依赖树，运行时 TLS 实际用 ring——aws-lc 只是构建期成本，关闭 feature 即可
# 整体移除；上游修正特性声明后此代价也会自然消失。
futures-util = { version = "0.3", default-features = false, features = ["std"], optional = true }
kothok-edge-tts = { version = "0.2.10", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
# 0.13 起 rustls 是默认 TLS 后端、默认 crypto provider 换成 aws-lc，且 rustls
# 相关 feature 更名（rustls-tls → rustls）。aido 用 rustls-no-provider 甩掉默认
# provider，由下面配套的 rustls（ring）+ webpki-roots 构造 ClientConfig 经
# tls_backend_preconfigured 传入（api/transport.rs）：--no-default-features
# 构建由此继续不含 aws-lc，根证书也保持 webpki-roots（0.13 默认已换平台证书库）。
# system-proxy 在 0.13 属 default features（此处关了 default），不显式开启会
# 静默失去 HTTP(S)_PROXY 支持；json/multipart 仍按需单开。
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls-no-provider", "system-proxy"] }
# reqwest 的 TLS 配套（见上）：provider 与 feature 形状（ring/std/tls12）和
# kothok-edge-tts 经 tokio-rustls 的解析保持一致，全树只编译一份 rustls。
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "signal"] }
toml = "0.8"
unicode-width = "0.2"
lopdf = "0.45.0"
# chrono feature: dates render as YYYY-MM-DDTHH:MM:SS instead of raw
# Excel serial numbers; chrono enters no additional crate beyond lopdf's
# own dependency on it.
calamine = { version = "0.36.1", features = ["chrono"] }
# Same version and feature shape calamine uses, so both resolve to one
# compiled instance: the xlsx loader bounds the entries calamine eagerly
# decompresses at open time (a lying declared size in the central
# directory costs nothing to write, and zip's deflate reader does not cap
# output on its own).
zip = { version = "8.6", default-features = false, features = ["deflate"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
flate2 = "1.1.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
rust_xlsxwriter = "0.99.1"
serde_json = "1"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
