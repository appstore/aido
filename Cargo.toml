[package]
name = "aido"
version = "0.1.0"
edition = "2021"
# 依赖下限：image 0.25 与 reqwest 传递引入的 icu_* 系列声明 1.88；CI 的 msrv job 验证
rust-version = "1.88"
description = "Send clipboard or piped stdin content to any OpenAI-compatible model; write the result to stdout or back to the clipboard"

[dependencies]
anyhow = "1"
arboard = { version = "3", features = ["image-data", "wayland-data-control"] }
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
dirs = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
toml = "0.8"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
