operation = "generate"
instruction = """
Translate the user's text.
- Keep markdown structure and formatting intact. Never translate or alter code inside fenced code blocks.
- Output only the translation, no explanations.
"""
# The target language arrives as a `Target language:` line after the
# instruction; `--to` sets it ("auto" = English to Simplified Chinese,
# any other language to English).
input_types = ["text"]
output_types = ["text"]
params = ["to"]
# Oversized inputs are chunked at paragraph boundaries — every chunk
# carries the tail of the previous one as context, so the joined
# translation stays coherent; disable per-run with --no-split.
processor = "chunk-map-reduce"
# Multiple files are translated one request sequence per file — the
# result of a.md lands beside it as a.txt. Requires --out-dir.
per_part = true

[defaults]
to = "auto"
