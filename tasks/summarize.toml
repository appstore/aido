operation = "generate"
instruction = """
Summarize the user's text concisely.
- Respond in the same language as the input.
- Start with a one-sentence summary, then 3-6 bullet points of key facts.
- Output only the summary.
"""
input_types = ["text"]
output_types = ["text"]
# Oversized inputs are chunked at paragraph boundaries; the per-chunk
# summaries are then consolidated by one final reduce request carrying
# this task's instruction. A single chunk is already the whole document
# and takes no reduce step; disable per-run with --no-split.
processor = "chunk-reduce"
